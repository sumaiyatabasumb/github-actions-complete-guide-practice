name: Deploy using cache and outputs file
on: 
  push:
    branches: [main, dev]
  workflow_dispatch: 
env:
  DAY_OF_WEEK: Monday
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - name: Get Cache and outputs details
        uses: ./.github/workflows/CacheAndOutputs.yml
        with:
          java-version: 21
      - name: Echo env variable
        run: echo "Today is ${{ env.DAY_OF_WEEK }}"
